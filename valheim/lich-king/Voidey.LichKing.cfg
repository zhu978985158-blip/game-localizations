## 制作魂铸钢时是否只需满足任意一种材料。
# 设置类型：<496aaf82-edbd-4780-8db0-ae4e020297b9>Toggle
# 默认值：Off
# 可选值：Off, On
Require only one resource = Off

## 制作魂铸钢时，根据材料品质提高产出数量；仅在“仅需一种材料”开启时生效。
# 设置类型：Single
# 默认值：1
Quality Multiplier = 1

## 制作魂铸钢所需的材料。
# 设置类型：String
# 默认值：FlametalNew:30,Silver:30,YagluthDrop:3,DragonTear:10
Crafting Costs = FlametalNew:30,Silver:30,YagluthDrop:3,DragonTear:10

## 会掉落魂铸钢的生物预制体。
# 设置类型：String
# 默认值：
Drops from = 

## 魂铸钢的重量。
# 设置类型：Single
# 默认值：12
Weight = 12

## 魂铸钢的商人价值。
# 设置类型：Int32
# 默认值：0
Trader Value = 0

## 出售魂铸钢的商人。
