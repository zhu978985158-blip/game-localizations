Trader Required Global Key = defeated_bonemass

[Soulforged Steel]

## 制作魂铸钢所使用的工作台。
# 设置类型：<496aaf82-edbd-4780-8db0-ae4e020297b9>CraftingTable
# 默认值：BlackForge
# 可选值：Disabled, Inventory, Workbench, Cauldron, MeadCauldron, Forge, ArtisanTable, StoneCutter, MageTable, PrepTable, BlackForge, Custom
