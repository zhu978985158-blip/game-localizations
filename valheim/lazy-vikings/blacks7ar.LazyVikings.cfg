# —— 01 - 服务器同步 ——
[01- ServerSync]

## 开启后将锁定配置，仅服务器管理员可以修改。【与服务器同步】
# 设置类型：Toggle
# 默认值：On
# 可选值：Off, On
Lock Configuration = On

# —— 02 - 常规 ——
[02- General]

## 开启后，容器中每种材料至少保留 1 个。【与服务器同步】
# 设置类型：Toggle
# 默认值：On
# 可选值：Off, On
Leave One = On

## 开启后，只有容器内原本已有该物品时才会自动存入。【与服务器同步】
# 设置类型：Toggle
# 默认值：Off
# 可选值：Off, On
Must Have = Off

# —— 03 - 蜂箱 ——
[03- Beehive]

## 启用或停用蜂箱自动化。【与服务器同步】
# 设置类型：Toggle
# 默认值：On
# 可选值：Off, On
Enable = On

## 蜂箱搜索附近容器的范围。【与服务器同步】
# 设置类型：Single
# 默认值：5
# 可选范围：1 至 50
Radius = 5

# —— 04 - 高炉 ——
[04- Blast Furnace]

## 启用或停用高炉自动化。【与服务器同步】
# 设置类型：Toggle
# 默认值：On
# 可选值：Off, On
Enable = On

## 选择自动化内容：存入成品、补充燃料，或两者都启用。【与服务器同步】
# 设置类型：Automation
# 默认值：Both
# 可选值：Deposit, Fuel, Both
Automation = Both

## 高炉搜索附近容器的范围。【与服务器同步】
# 设置类型：Single
# 默认值：5
# 可选范围：1 至 50
Radius = 5

## 开启后，高炉自动化会忽略私人区域权限检查。【与服务器同步】
# 设置类型：Toggle
# 默认值：On
# 可选值：Off, On
Ignore Private Area Check = On

## 开启后，所有矿石都可以放入高炉处理。【与服务器同步】
# 设置类型：Toggle
# 默认值：Off
# 可选值：Off, On
Allow All Ores = Off

